<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <radialGradient id="portraitGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1c1c28"/>
      <stop offset="60%" stop-color="#101017"/>
      <stop offset="100%" stop-color="#08080c"/>
    </radialGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#portraitGlow)"/>

  <!-- Minimalist background light beam -->
  <path d="M120 0 L 260 750 L 160 750 Z" fill="rgba(255, 90, 31, 0.06)"/>

  <!-- Stylized Chiaroscuro Artist Figure -->
  <g transform="translate(140, 90)">
    <!-- Shoulders & Turtleneck -->
    <path d="M30 450 C 30 360, 80 340, 160 340 C 240 340, 290 360, 290 450 L 320 620 L 0 620 Z" fill="#0d0d14"/>
    <path d="M110 340 L 210 340 L 205 390 L 115 390 Z" fill="#12121c" stroke="#252535" stroke-width="1"/>
    
    <!-- Neck -->
    <rect x="125" y="270" width="70" height="80" rx="10" fill="#201f28"/>
    <!-- Rim light on side of neck -->
    <path d="M190 270 L 195 340" stroke="#ff8c42" stroke-width="4" stroke-linecap="round"/>

    <!-- Head & Jawline (Moody editorial chiaroscuro) -->
    <!-- Shadow side of head -->
    <path d="M90 140 C 90 70, 230 70, 230 140 C 230 220, 205 285, 160 285 C 115 285, 90 220, 90 140 Z" fill="#282734"/>
    <!-- Lit half of face -->
    <path d="M160 78 C 225 78, 228 140, 228 200 C 228 260, 195 282, 160 284 Z" fill="#323142"/>
    <!-- Intense theatrical rim contour on right edge -->
    <path d="M185 85 C 235 110, 235 220, 195 275" stroke="#ff5a1f" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Hair (Sculpted modern cut) -->
    <path d="M80 130 C 80 50, 170 30, 235 60 C 245 100, 240 140, 240 140 C 230 90, 190 65, 150 70 C 110 75, 90 100, 80 130 Z" fill="#161520"/>
    <path d="M150 45 C 190 40, 220 50, 235 65" stroke="#ff8c42" stroke-width="2.5" fill="none"/>

    <!-- Eyes, Eyebrows & Thoughtful Expression -->
    <!-- Left brow in shadow -->
    <path d="M115 140 Q 135 135, 148 142" stroke="#161520" stroke-width="4" stroke-linecap="round"/>
    <!-- Right brow in light -->
    <path d="M172 142 Q 185 135, 205 140" stroke="#1a1926" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="135" cy="156" r="3" fill="#666"/>
    <circle cx="188" cy="156" r="3.5" fill="#e2e8f0"/>
    <circle cx="189" cy="155" r="1" fill="#fff"/>

    <!-- Nose bridge -->
    <path d="M160 145 L 165 190 L 155 198 L 168 198" stroke="#1c1b26" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Lips & Chin line -->
    <path d="M145 225 Q 160 228, 175 225" stroke="#1e1d2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 248 Q 160 252, 170 248" stroke="#1a1926" stroke-width="2" stroke-linecap="round"/>

    <!-- Glasses / Modern Frame Accent -->
    <rect x="110" y="142" width="44" height="28" rx="6" stroke="#ff5a1f" stroke-width="2" fill="none" opacity="0.85"/>
    <rect x="166" y="142" width="44" height="28" rx="6" stroke="#ff5a1f" stroke-width="2" fill="none" opacity="0.85"/>
    <path d="M154 154 L 166 154" stroke="#ff5a1f" stroke-width="2.5"/>
    <path d="M210 150 L 228 146" stroke="#ff5a1f" stroke-width="2"/>
  </g>

  <!-- Editorial Card Framing Overlay -->
  <rect x="20" y="20" width="560" height="710" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="45" y="700" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f1f1f4" letter-spacing="3">İSMAİL SEMİH HABİBOĞULLARI</text>
  <text x="555" y="700" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#ff5a1f" text-anchor="end">PORTRE</text>
</svg>
