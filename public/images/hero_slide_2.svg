<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <radialGradient id="podGlow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#121218" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b0b0f" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ff8c42" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="#0b0b0f"/>
  <rect width="1200" height="400" fill="url(#podGlow)"/>

  <!-- Audio Waveform Visualizer Ribbons -->
  <g transform="translate(480, 210)">
    <!-- Mirrored sound bars -->
    <rect x="0" y="-20" width="4" height="40" rx="2" fill="#ff5a1f" opacity="0.4"/>
    <rect x="12" y="-45" width="4" height="90" rx="2" fill="#ff5a1f" opacity="0.6"/>
    <rect x="24" y="-30" width="4" height="60" rx="2" fill="#ff5a1f" opacity="0.5"/>
    <rect x="36" y="-70" width="4" height="140" rx="2" fill="#ff5a1f"/>
    <rect x="48" y="-95" width="4" height="190" rx="2" fill="#ff8c42"/>
    <rect x="60" y="-55" width="4" height="110" rx="2" fill="#ff5a1f"/>
    <rect x="72" y="-85" width="4" height="170" rx="2" fill="#ff8c42"/>
    <rect x="84" y="-110" width="4" height="220" rx="2" fill="#ff5a1f"/>
    <rect x="96" y="-60" width="4" height="120" rx="2" fill="#ff5a1f" opacity="0.8"/>
    <rect x="108" y="-120" width="4" height="240" rx="2" fill="#ff8c42"/>
    <rect x="120" y="-80" width="4" height="160" rx="2" fill="#ff5a1f"/>
    <rect x="132" y="-135" width="4" height="270" rx="2" fill="#ff5a1f"/>
    <rect x="144" y="-90" width="4" height="180" rx="2" fill="#ff8c42"/>
    <rect x="156" y="-60" width="4" height="120" rx="2" fill="#ff5a1f" opacity="0.7"/>
    <rect x="168" y="-115" width="4" height="230" rx="2" fill="#ff5a1f"/>
    <rect x="180" y="-75" width="4" height="150" rx="2" fill="#ff8c42"/>
    <rect x="192" y="-40" width="4" height="80" rx="2" fill="#ff5a1f" opacity="0.5"/>
    <rect x="204" y="-90" width="4" height="180" rx="2" fill="#ff5a1f"/>
    <rect x="216" y="-50" width="4" height="100" rx="2" fill="#ff5a1f" opacity="0.6"/>
    <rect x="228" y="-25" width="4" height="50" rx="2" fill="#ff5a1f" opacity="0.3"/>
  </g>

  <!-- Large Vintage Studio Broadcast Microphone -->
  <g transform="translate(860, 100)">
    <!-- Halo glow -->
    <circle cx="70" cy="90" r="110" fill="rgba(255, 90, 31, 0.12)" filter="blur(20px)"/>
    <!-- Mic Stand -->
    <rect x="66" y="180" width="8" height="120" fill="#2a2a38" rx="2"/>
    <rect x="35" y="295" width="70" height="10" rx="5" fill="#1e1e2c" stroke="#ff5a1f" stroke-width="1.5"/>
    <!-- Mic Shockmount cradle ring -->
    <circle cx="70" cy="95" r="54" stroke="#ff5a1f" stroke-width="2.5" fill="none" opacity="0.8"/>
    <!-- Capsule Body -->
    <rect x="46" y="45" width="48" height="95" rx="24" fill="#151522" stroke="#f1f1f4" stroke-width="2"/>
    <!-- Metal Mesh Grill -->
    <path d="M46 72 L 94 72" stroke="#ff8c42" stroke-width="2"/>
    <line x1="52" y1="50" x2="52" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="60" y1="46" x2="60" y2="94" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="70" y1="45" x2="70" y2="95" stroke="#ff5a1f" stroke-width="2"/>
    <line x1="80" y1="46" x2="80" y2="94" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <line x1="88" y1="50" x2="88" y2="90" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <!-- Broadcast ON AIR badge -->
    <rect x="42" y="148" width="56" height="18" rx="4" fill="#ff5a1f"/>
    <text x="70" y="161" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#0b0b0f" text-anchor="middle" letter-spacing="1.5">ON AIR</text>
  </g>

  <!-- Frame & branding labels -->
  <rect x="24" y="24" width="1152" height="352" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="50" y="70" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" fill="#ff5a1f" letter-spacing="3">BEN BİR İSMAİL PODCAST</text>
  <text x="1150" y="70" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.4)" text-anchor="end">HER PAZAR SPOTIFY &amp; YOUTUBE</text>
</svg>
