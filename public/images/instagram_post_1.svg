  <rect x="24" y="24" width="120" height="28" rx="6" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)"/>
  <text x="84" y="42" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ff5a1f" text-anchor="middle">PROVA GÜNLÜĞÜ</text>
