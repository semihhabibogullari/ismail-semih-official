  <!-- Stage floor grid -->
  <line x1="40" y1="440" x2="560" y2="440" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <line x1="40" y1="500" x2="560" y2="500" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
